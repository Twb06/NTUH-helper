name: Lint JS

on:
  push:
    paths:
      - "**/*.js"
  pull_request:
    paths:
      - "**/*.js"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
